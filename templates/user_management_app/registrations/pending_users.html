{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Utilisateurs à valider</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Département</th>
                <th>Rôle</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.departement }}</td>
                <td>{{ user.get_role_display }}</td>
                <td>
                    <a href="{% url 'validate_user' user.id %}" class="btn btn-success btn-sm">Valider</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">Aucun utilisateur en attente.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
