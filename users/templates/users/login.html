{% extends 'users/base.html' %}
{% load bootstrap5 %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <h1 class="text-center mb-3">Login</h1>
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% bootstrap_form form %}
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

# This template is used for the login form. It extends the base template and uses Bootstrap for styling.
