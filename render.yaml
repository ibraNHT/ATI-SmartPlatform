# Render configuration file
# Documentation: https://render.com/docs/infrastructure-as-code

services:
  # Web service
  - type: web
    name: ati-smart-platform
    env: python
    region: frankfurt  # or choose a region closer to your users
    buildCommand: |
      # Install system dependencies
      apt-get update && apt-get install -y python3-dev build-essential
      
      # Set up Python environment
      python -m pip install --upgrade pip setuptools wheel
      
      # Install Python dependencies
      pip install -r requirements-prod.txt --no-cache-dir
      
      # Collect static files
      python manage.py collectstatic --noinput --clear
      
      # Run migrations
      python manage.py migrate --noinput
    startCommand: |
      gunicorn src.Ati_smart_platform.wsgi:application \
        --pythonpath ./src \
        --log-file - \
        --workers 4 \
        --threads 4 \
        --timeout 120 \
        --bind 0.0.0.0:10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9  # Match runtime.txt Python version
      - key: DJANGO_SETTINGS_MODULE
        value: Ati_smart_platform.settings
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
    plan: free  # or 'standard' for production
    numInstances: 1
    healthCheckPath: /
    autoDeploy: true

  # PostgreSQL database (uncomment and configure if needed)
  # - type: postgres
  #   name: ati-smart-platform-db
  #   plan: free  # or 'standard' for production
  #   databaseName: ati_smart_platform
  #   user: ati_user
  #   region: frankfurt  # should match web service region
